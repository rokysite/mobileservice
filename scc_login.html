<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - ব্যবসা ব্যবস্থাপনা সিস্টেম</title>
    <link rel="stylesheet" href="scc_style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f1f5f9; }
        .login-card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        .login-card h3 { margin-bottom: 20px; text-align: center; color: var(--primary); }
    </style>
</head>
<body>

<div class="login-card">
    <h3>🔐 সিস্টেম লগইন</h3>
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group" style="margin-bottom: 12px;">
            <label>ইউজারনেম</label>
            <input type="text" id="username" required style="width:100%; height:32px; padding:4px 8px; border:1px solid var(--border); border-radius:4px;">
        </div>
        <div class="form-group" style="margin-bottom: 15px;">
            <label>পাসওয়ার্ড</label>
            <input type="password" id="password" required style="width:100%; height:32px; padding:4px 8px; border:1px solid var(--border); border-radius:4px;">
        </div>
        <button type="submit" class="btn-submit" style="width: 100%; height: 35px;">লগইন করুন</button>
    </form>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTWKsHqRWJH4W7wLgvHwQICS9jtvbePd0ZQDbasoKV39V2YEb0s-vAbFr9MeciVy5zyw/exec";

function handleLogin(e) {
    e.preventDefault();
    let u = document.getElementById("username").value.trim();
    let p = document.getElementById("password").value.trim();

    fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "login", username: u, password: p })
    })
    .then(res => res.json())
    .then(res => {
        if(res.status === "success") {
            localStorage.setItem("loggedInUser", u);
            localStorage.setItem("userRole", res.role);
            window.location.href = "scc_index.html";
        } else {
            alert(res.message);
        }
    })
    .catch(err => alert("লগইন করতে সমস্যা হয়েছে!"));
}
</script>

</body>
</html>
